# ============================================================
# application.properties
# StudbuddY Backend Configuration
# ============================================================
#
# This file configures your Spring Boot application.
# Spring Boot reads this file on startup.
# Think of it like a .env file in your React/Node projects —
# but with a structured key=value format.
#
# Lines starting with # are COMMENTS — Spring Boot ignores them.
# ============================================================

# ------------------------------------------------------------
# APPLICATION NAME
# Used in logs and monitoring tools to identify your app
# ------------------------------------------------------------
spring.application.name=StudbuddY Backend

# ------------------------------------------------------------
# SERVER CONFIGURATION
# ------------------------------------------------------------
# Port the app listens on. Default is 8080.
# If 8080 is already in use, change this to 8081 or 9090.
server.port=8080

# ------------------------------------------------------------
# DATABASE CONFIGURATION (MySQL)
# ------------------------------------------------------------
#
# WHAT IS A JDBC URL?
# JDBC = Java Database Connectivity — the standard way Java talks to databases.
# Format: jdbc:[database-type]://[host]:[port]/[database-name]
#
# Breaking down jdbc:mysql://localhost:3306/studbuddy_db :
#   - jdbc:mysql   → we're connecting to MySQL (not PostgreSQL, H2, etc.)
#   - localhost    → the database is on THIS computer (not a remote server)
#   - 3306         → MySQL's default port number
#   - studbuddy_db → the name of our database (we'll create this in MySQL)
#
# useSSL=false          → Don't require encrypted SSL connection (fine for local dev)
# serverTimezone=UTC    → Tell MySQL which timezone to use for timestamps
# allowPublicKeyRetrieval=true → Required for newer MySQL versions with caching_sha2_password
#
spring.datasource.url=jdbc:mysql://localhost:3306/studbuddy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL database username
# For local development, "root" is the default admin user
spring.datasource.username=root

# ⚠️ IMPORTANT: Replace 'your_mysql_password' with your actual MySQL root password
# If you set a password during MySQL installation, enter it here.
# If you left the password blank during installation, leave this empty: spring.datasource.password=
#
# SECURITY NOTE: In a real project, NEVER commit real passwords to Git.
# For now, this is fine for local development on your own computer.
spring.datasource.password=Admin1234

# JDBC Driver class — tells Spring which MySQL driver to use
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ------------------------------------------------------------
#
# WHAT IS JPA?
# JPA = Java Persistence API. It's a STANDARD/SPECIFICATION (like a contract)
# that defines HOW Java applications should interact with databases.
# JPA itself doesn't do the actual work — Hibernate does.
#
# WHAT IS HIBERNATE?
# Hibernate is the most popular IMPLEMENTATION of the JPA specification.
# It does the actual work: converts your Java class (Student) into SQL
# (CREATE TABLE students, INSERT INTO students, etc.)
#
# JPA is like the "interface" (the spec/contract)
# Hibernate is like the "class that implements that interface" (the actual code)
#
# Analogy: JPA = USB standard, Hibernate = the actual USB cable
#
# ddl-auto options:
#   - none        → Hibernate does NOTHING to the database schema (you manage it manually)
#   - validate    → Hibernate checks that the DB matches your entities (good for production)
#   - update      → Hibernate adds new columns but doesn't delete old ones (Phase 3+)
#   - create      → DANGER: Drops and recreates all tables on every startup (loses data!)
#   - create-drop → DANGER: Drops all tables when app shuts down (loses data!)
#
# Phase 3: We now have the Student entity, so we use "update".
# "update" tells Hibernate: "look at our @Entity classes and make the
# database match — add missing tables/columns, but NEVER delete existing data."
# This is safe for local development. For production, use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update

# Which SQL dialect to use — Hibernate 6 auto-detects MySQL, so this line is optional.
# We leave it commented out to avoid a deprecation warning.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Show generated SQL in the logs (helpful for learning and debugging)
# Set to false in production to reduce log noise
spring.jpa.show-sql=true

# Format the SQL nicely in logs (easier to read)
spring.jpa.properties.hibernate.format_sql=true

# Suppress the open-in-view warning (we don't use server-side views)
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# LOGGING CONFIGURATION
# ------------------------------------------------------------
# Show Spring Boot's startup and connection logs in detail
# This helps us verify the database connection on startup
logging.level.org.springframework=INFO
logging.level.com.studbuddy=DEBUG

# ------------------------------------------------------------
# JWT CONFIGURATION (Phase 4)
# ------------------------------------------------------------
#
# JWT SECRET KEY
# This string is the signing secret. It must be:
#   - At least 256 bits (32 bytes) for HS256
#   - Base64-encoded
#   - NEVER committed to a public Git repository in a real project
#
# For this college assignment on localhost, storing it here is acceptable.
# For a real product: use an environment variable and reference it as:
#   jwt.secret=${JWT_SECRET}
# then set the actual value in your OS environment, not here.
#
# This specific value is a randomly generated 256-bit key — safe for local dev.
# Change it to your own random Base64 string in a real deployment.
jwt.secret=dGhpcyBpcyBhIHNlY3VyZSBrZXkgZm9yIHN0dWRidWRkeSBwaGFzZTQgand0IHNpZ25pbmc=

# JWT EXPIRATION
# How long (in milliseconds) a token is valid after being issued.
# 1800000 ms = 30 minutes
# After expiry, the user must log in again.
jwt.expiration=1800000
